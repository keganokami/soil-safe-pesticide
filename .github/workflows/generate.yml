name: 判定JSONの生成

on:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 03:00 JST
  workflow_dispatch:
    inputs:
      only:
        description: "この商品名だけを強制的に再判定（カンマ区切り。空なら通常処理）"
        required: false
        default: ""
      max_per_run:
        description: "1回で生成する最大件数"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: weekly-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - name: 判定を生成
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ONLY: ${{ inputs.only }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '10' }}
          STALE_DAYS: "90"
        run: npm run generate
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/verdicts
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "判定データを更新 ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
