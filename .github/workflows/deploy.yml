name: GitHub Pages へデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["判定JSONの生成", "判定リクエストの受付"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          NEXT_PUBLIC_REQUEST_FORM_URL: ${{ vars.REQUEST_FORM_URL }}
          NEXT_PUBLIC_REQUEST_FORM_NAME_ENTRY: ${{ vars.REQUEST_FORM_NAME_ENTRY }}
          NEXT_PUBLIC_FEEDBACK_FORM_URL: ${{ vars.FEEDBACK_FORM_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
