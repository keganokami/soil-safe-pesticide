name: 判定リクエストの受付

# 「判定リクエスト」テンプレートで Issue が立ったら自動で判定し、結果を Issue に返信する。
#   ① 入力ゲート（回数制限・商品名チェック） → ② 対象判定ゲート → 判定 → ③ 出力ゲート
#   公開できる結果のときだけコミットする。対象外は何も残さず「対象外」ラベルでクローズ。
# 候補が複数（要確認）のときは Issue を編集すると再判定。手動やり直しは「approved」ラベル。
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: request-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  PER_USER_PER_DAY: "3"   # 1人あたり24時間の上限（リポジトリ所有者は対象外）
  TOTAL_PER_DAY: "30"     # 全体の24時間の上限

jobs:
  judge:
    if: >-
      github.event.issue.state == 'open' && !github.event.issue.pull_request && (
        (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, '判定リクエスト')) ||
        (github.event.action == 'edited' && contains(github.event.issue.labels.*.name, '要確認')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'approved')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 回数制限
        id: limit
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          TOTAL=$(gh issue list -R "$GITHUB_REPOSITORY" --label 判定リクエスト --state all --search "created:>=$SINCE" --limit 200 --json number -q 'length')
          MINE=$(gh issue list -R "$GITHUB_REPOSITORY" --label 判定リクエスト --state all --author "$AUTHOR" --search "created:>=$SINCE" --limit 200 --json number -q 'length')
          echo "total=$TOTAL mine=$MINE"
          if [ "$AUTHOR" != "$OWNER" ] && [ "$MINE" -gt "$PER_USER_PER_DAY" ]; then
            echo "reason=1人あたりの1日の上限（${PER_USER_PER_DAY}件）を超えました。時間をおいてお試しください" >> "$GITHUB_OUTPUT"
          elif [ "$AUTHOR" != "$OWNER" ] && [ "$TOTAL" -gt "$TOTAL_PER_DAY" ]; then
            echo "reason=本日の受付上限に達しました。時間をおいてお試しください" >> "$GITHUB_OUTPUT"
          fi

      - name: 受付コメント
        if: steps.limit.outputs.reason == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "リクエストを受け付けました。判定を始めます（数分〜十数分かかります）。"

      - name: ① 入力ゲート（商品名を取り出して検査）
        id: add
        if: steps.limit.outputs.reason == ''
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/add-request.mjs

      - run: npm ci
        if: steps.add.outputs.query != ''
      - run: npm install -g @anthropic-ai/claude-code
        if: steps.add.outputs.query != ''
      - name: ②対象判定 → 判定 → ③出力ゲート
        if: steps.add.outputs.query != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ONLY: ${{ steps.add.outputs.query }}
          MAX_PER_RUN: "1"
          RESULT_FILE: ${{ runner.temp }}/result.json
        run: npm run generate || true

      - name: 結果を判定
        id: reply
        if: always()
        env:
          QUERY: ${{ steps.add.outputs.query }}
          REJECT_REASON: ${{ steps.limit.outputs.reason || steps.add.outputs.reject_reason }}
          RESULT_FILE: ${{ runner.temp }}/result.json
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/issue-reply.mjs

      - name: 公開できる結果だけコミット
        if: steps.reply.outputs.outcome == 'published'
        env:
          QUERY: ${{ steps.add.outputs.query }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/requests public/data/verdicts
          git diff --cached --quiet && exit 0
          git commit -m "判定リクエスト: ${QUERY} (#${ISSUE})"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Issue を更新
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.reply.outputs.outcome }}
        run: |
          R="$GITHUB_REPOSITORY"
          [ -f reply.md ] && gh issue comment "$ISSUE" -R "$R" --body-file reply.md
          case "$OUTCOME" in
            published)
              gh issue edit "$ISSUE" -R "$R" --remove-label 要確認 || true
              gh issue close "$ISSUE" -R "$R" --reason completed ;;
            rejected)
              gh issue edit "$ISSUE" -R "$R" --add-label 対象外 --remove-label 要確認 || true
              gh issue close "$ISSUE" -R "$R" --reason "not planned" ;;
            *)
              gh issue edit "$ISSUE" -R "$R" --add-label 要確認 ;;
          esac
